name: harness-ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ce-lite shield loop regression
        run: node extensions/test-ce-lite-shield.mjs
      - name: ce-lite preload heuristics
        run: node bench/test-ce-lite-preload.mjs
      - name: btw model assignment
        run: node scripts/ensure-btw-model.test.mjs
